<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Udaan News</title>
<link rel="icon" href="logo-small.png">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#16181d;--muted:#5a5f6a;--accent:#d81f26;--accent-dark:#a5141a;--border:#e4e6ea;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1115;--card:#1a1d24;--text:#eef0f3;--muted:#a2a7b2;--accent:#ff4b52;--accent-dark:#ff7a7f;--border:#2b2f38;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);}
  .topbar{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:14px 16px;flex-wrap:wrap;gap:10px;}
  .logo{font-weight:800;font-size:1.4rem;}
  .logo span{color:var(--accent);}
  #loc-badge{font-size:.8rem;background:var(--border);padding:4px 10px;border-radius:20px;color:var(--muted);}
  nav{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:.9rem;}
  nav button{background:none;border:none;color:var(--text);font:inherit;cursor:pointer;padding:4px 0;}
  nav button.active{color:var(--accent);border-bottom:2px solid var(--accent);}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  .updated{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .card .src{font-size:.72rem;font-weight:800;color:var(--accent);text-transform:uppercase;}
  .card h4{margin:6px 0;font-size:1rem;}
  .card .time{font-size:.75rem;color:var(--muted);}
  .empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 16px;}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px;}

  .logo-img{height:60px; width:auto; display:block;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-img{filter:invert(1);}}
  :root[data-theme="dark"] .logo-img{filter:invert(1);}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="logo" href="./"><img class="logo-img" alt="Udaan News" src="logo-small.png"></a>
    <span id="loc-badge">📍 location detect ho raha hai...</span>
  </div>
  <div class="topbar" style="padding-top:0;">
    <nav id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <div class="updated" id="updated">Loading...</div>
  <div class="grid" id="news-grid"><div class="empty">News load ho raha hai...</div></div>
</div>

<footer>© 2026 Udaan News — Headlines aggregated from public sources, links to original publishers.</footer>

<script src="news.js"></script>
<script>
const CATS = {desh:"देश", duniya:"दुनिया", business:"बिज़नेस", khel:"खेल", manoranjan:"मनोरंजन", technology:"टेक्नोलॉजी"};
let NEWS = null;
let currentTab = "desh";
let matchedCity = null;

async function loadNews(){
  buildTabs();
  try{
    if(window.NEWS_DATA){
      NEWS = window.NEWS_DATA;
    }else{
      const res = await fetch("news.json", {cache:"no-store"});
      NEWS = await res.json();
    }
    document.getElementById("updated").textContent =
      "आखिरी अपडेट: " + new Date(NEWS.generated_at).toLocaleString("hi-IN");
    render(currentTab);
  }catch(e){
    document.getElementById("updated").textContent = "";
    document.getElementById("news-grid").innerHTML =
      '<div class="empty">News data load nahi hua. Site ko GitHub Pages (https) par kholiye, ya news.js file index.html ke saath usi folder me rakhein.</div>';
  }
}

function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  Object.keys(CATS).forEach(key=>{
    const b = document.createElement("button");
    b.textContent = CATS[key];
    b.onclick = ()=>{ currentTab = key; matchedCity = null; render(key); highlight(b); };
    tabs.appendChild(b);
  });
  highlight(tabs.children[0]);
}

function highlight(btn){
  [...document.getElementById("tabs").children].forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function render(catKey){
  const grid = document.getElementById("news-grid");
  const items = matchedCity ? (NEWS.cities[matchedCity] || []) : (NEWS.categories[catKey] || []);
  if(!items.length){ grid.innerHTML = '<div class="empty">Abhi news nahi aayi hai. GitHub par Actions tab → "Update Udaan News" → Run workflow chalayein, 1-2 minute me yahan news dikhne lagegi.</div>'; return; }
  grid.innerHTML = items.map(n => `
    <a class="card" href="${n.link}" target="_blank" rel="noopener">
      <div class="src">${n.source || "News"}</div>
      <h4>${n.title}</h4>
      <div class="time">${n.published || ""}</div>
    </a>
  `).join("");
}

async function detectLocation(){
  const badge = document.getElementById("loc-badge");
  if(!navigator.geolocation){ badge.textContent = "📍 location supported nahi"; return; }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const {latitude, longitude} = pos.coords;
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
      const data = await r.json();
      const city = data.address.city || data.address.town || data.address.state_district || data.address.state || "";
      badge.textContent = "📍 " + (city || "Location mila");
      if(NEWS){
        const known = Object.keys(NEWS.cities).find(c => city.toLowerCase().includes(c.toLowerCase()));
        if(known){
          matchedCity = known;
          badge.textContent = "📍 " + known + " ki local news";
          render(currentTab);
        }
      }
    }catch(e){ badge.textContent = "📍 location detect nahi ho paya"; }
  }, ()=>{ badge.textContent = "📍 location permission nahi mili"; });
}

loadNews();
detectLocation();
</script>
</body>
</html>
